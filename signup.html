<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <title>Sign Up - CouponCentral</title>
</head>
<body>
    <div class="container">
        <h2>Create Account</h2>
        <form>
            <input type="text" placeholder="Username" required style="margin-bottom: 10px; padding: 10px; width: 200px;">
            <br>
            <input type="email" placeholder="Email" required style="margin-bottom: 10px; padding: 10px; width: 200px;">
            <br>
            <input type="password" placeholder="Password" required style="margin-bottom: 10px; padding: 10px; width: 200px;">
            <br>
            <button type="submit" class="btn">Sign Up</button>
        </form>
        <p><a href="index.html">Back to Home</a></p>
    </div>
</body>
</html>
